name: focuschainlabs_mobile
description: Ona — the FocusChain Labs CRM, on your phone.
publish_to: "none"
version: 1.1.0+6

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  bloc: ^8.1.4
  flutter_bloc: ^8.1.6
  equatable: ^2.0.7
  get_it: ^8.0.3
  intl: ^0.20.2
  # UI / UX
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  curved_navigation_bar: ^1.0.6
  # Session cache
  shared_preferences: ^2.3.2
  # The CRM API, plus the handoffs out of the app (WhatsApp, dialler, mail)
  http: ^1.2.2
  url_launcher: ^6.3.1
  webview_flutter: ^4.10.0     # the web app's desktop-only surfaces
  speech_to_text: ^7.0.0       # dictating an activity note into a lead's chat
  flutter_dotenv: ^5.1.0       # API address, written by CI at build time
  # Firebase — sign-in is what tells the CRM which tenant the caller belongs to
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  google_sign_in: ^6.2.1
  firebase_analytics: ^11.3.3
  firebase_messaging: ^15.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
